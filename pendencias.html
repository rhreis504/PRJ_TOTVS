<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ==========================================
    // ÍCONES SVG (Substituindo lucide-react)
    // ==========================================
    const IconRefreshCw = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    );
    const IconAlertCircle = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
    );
    const IconSearch = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>

    const IconFilter = ({ size = 24, className = "" }) => (

    );
    const IconLayoutDashboard = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
    );
    const IconCheckCircle2 = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
    );
    const IconClock = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    );
    const IconAlertTriangle = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
    );
    const IconListTodo = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="5" width="6" height="6" rx="1"/><path d="m3 17 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg>
    );
    const IconTrendingUp = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
    );

    // ==========================================
    // FUNÇÕES UTILITÁRIAS
    // ==========================================
    const EXPECTED_HEADERS = ['ID','Área','Categoria','Etapa do Projeto','Sprint','Atividade','Descrição','Responsável','Criticidade','Responsável Cliente','Data Identificação','Data Planejada','Dias para Concluir','Condição Pendência','Data Conclusão','% Conclusão','Status'];

    function parseCSVToObjects(text) {
      const rows = [];
      let currentRow = [];
      let currentCell = '';
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (char === '"' && text[i + 1] === '"') {
          currentCell += '"';
          i++;
        } else if (char === '"') {
          insideQuotes = !insideQuotes;
        } else if (char === ',' && !insideQuotes) {
          currentRow.push(currentCell.trim());
          currentCell = '';
        } else if ((char === '\n' || char === '\r') && !insideQuotes) {
          if (char === '\r' && text[i + 1] === '\n') i++;
          currentRow.push(currentCell.trim());
          rows.push(currentRow);
          currentRow = [];
          currentCell = '';
        } else {
          currentCell += char;
        }
      }
      if (currentCell || text[text.length - 1] === ',') {
        currentRow.push(currentCell.trim());
      }
      if (currentRow.length > 0) {
        rows.push(currentRow);
      }

      const cleanedRows = rows.filter(row => row.some(cell => cell !== ''));
      if (cleanedRows.length === 0) return [];

      const stripLeadingEmptyColumn = (inputRows = []) => {
        if (inputRows.length === 0) return inputRows;

        const hasLeadingEmptyColumn = inputRows.every((row) => {
          if (!row || row.length === 0) return true;
          return (row[0] || '').trim() === '';
        });

        if (!hasLeadingEmptyColumn) return inputRows;
        return inputRows.map((row) => row.slice(1));
      };

      const normalizedRows = stripLeadingEmptyColumn(cleanedRows);

      const headers = EXPECTED_HEADERS;
      const normalize = (value = '') => value
        .toString()
        .normalize('NFD')
        .replace(/[̀-ͯ]/g, '')
        .toLowerCase()
        .trim();

      const headerMatches = (row = []) => {
        const normalizedExpected = headers.map(normalize);
        const normalizedRow = row.map(normalize);
        const matches = normalizedExpected.reduce((count, header, index) => {
          return count + (normalizedRow[index] === header ? 1 : 0);
        }, 0);
        return matches;
      };

      const sourceHeaderIndex = headerMatches(normalizedRows[1]) > headerMatches(normalizedRows[0]) ? 1 : 0;
      const sourceHeaders = normalizedRows[sourceHeaderIndex] || [];
      const sourceIndexByHeader = new Map(sourceHeaders.map((header, index) => [header, index]));
      const sprintIndex = headers.indexOf('Sprint');
      const hasSprintHeader = sourceIndexByHeader.has('Sprint');
      const data = [];

      const normalizedHeaders = headers.map(normalize);

      const isHeaderLikeRow = (cells) => {
        const normalizedCells = cells.map(normalize);

        const matchesAtOffset = (offset) => normalizedHeaders.every((header, index) => {
          const value = normalizedCells[index + offset] || '';
          return value === '' || value === header;
        });

        return matchesAtOffset(0) || matchesAtOffset(1) || matchesAtOffset(-1);
      };

      for (let i = sourceHeaderIndex + 1; i < normalizedRows.length; i++) {
        const row = normalizedRows[i];

        let alignedRow = row;

        if (!hasSprintHeader && row.length === headers.length - 1) {
          // Fonte sem coluna Sprint: insere célula vazia para manter o restante alinhado.
          alignedRow = [...row.slice(0, sprintIndex), '', ...row.slice(sprintIndex)];
        }

        if (isHeaderLikeRow(alignedRow)) continue;

        const rowValues = headers.map((header, index) => {
          const sourceIndex = sourceIndexByHeader.has(header) ? sourceIndexByHeader.get(header) : index;
          return (alignedRow[sourceIndex] || '').trim();
        });

        const hasRealContent = rowValues.some(cell => cell && cell !== '-');
        if (!hasRealContent || isHeaderLikeRow(rowValues)) continue;

        const obj = {};
        headers.forEach((header, index) => {
          obj[header] = rowValues[index] || '';
        });
        data.push(obj);
      }

      return { headers, data };
    }

    const FALLBACK_CSV = `ID,Área,Categoria,Etapa do Projeto,Sprint,Atividade,Descrição,Responsável,Criticidade,Responsável Cliente,Data Identificação,Data Planejada,Dias para Concluir,Condição Pendência,Data Conclusão,% Conclusão,Status
1,Governança,Planejamento,Iniciação,,Recebimento de documentos TOTVS,Receber materiais iniciais do projeto enviados pela TOTVS,Fabio Daumichen,Baixa,,28/04/2026,28/04/2026,,Dentro do Prazo,,100%,Concluída
2,Governança,Planejamento,Iniciação,,Consolidação de informações do projeto,Levantamento de escopo soluções contatos e propostas,Regis Reis,Baixa,,28/04/2026,29/04/2026,,Dentro do Prazo,,100%,Concluída
3,Governança,Planejamento,Iniciação,,Mapeamento de stakeholders,Identificação de contatos TOTVS e Rossi,Regis Reis,Baixa,,28/04/2026,29/04/2026,,Dentro do Prazo,,100%,Concluída
4,Técnico,Planejamento,Iniciação,,Identificação de dependências,Levantamento de dependências entre soluções,Regis Reis,Crítica,,28/04/2026,30/04/2026,,Dentro do Prazo,,50%,Em execução
5,Governança,Planejamento,Iniciação,,Definição da estratégia de comunicação,Criação da abordagem para alinhamento,Regis Reis,Média,,28/04/2026,08/05/2026,,Dentro do Prazo,,0%,Pendente`;

    // ==========================================
    // COMPONENTE PRINCIPAL
    // ==========================================
    function App() {
      const [dataset, setDataset] = useState({ headers: [], data: [] });
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [lastUpdated, setLastUpdated] = useState(null);

      const [searchTerm, setSearchTerm] = useState('');
      const [statusFilter, setStatusFilter] = useState('');
      const [criticidadeFilter, setCriticidadeFilter] = useState('');
      const [responsavelFilter, setResponsavelFilter] = useState('');
      const [areaFilter, setAreaFilter] = useState('');
      const [etapaFilter, setEtapaFilter] = useState('');
      const [condicaoFilter, setCondicaoFilter] = useState('');
      const [viewMode, setViewMode] = useState('lista');
      const [groupBy, setGroupBy] = useState('');
      const [sortBy, setSortBy] = useState('criticidade');
      const [savedViews, setSavedViews] = useState(() => {
        const storedViews = localStorage.getItem('totvs-pendencias-views');
        if (!storedViews) return [];
        try {
          const parsedViews = JSON.parse(storedViews);
          return Array.isArray(parsedViews) ? parsedViews : [];
        } catch (err) {
          console.warn('Não foi possível carregar visões salvas:', err);
          return [];
        }
      });
      const [selectedViewId, setSelectedViewId] = useState('');

      const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRtv0fQo2zhQbwtFFvJRkG-aK8EjzorUup951_Pt6x0UAbRwT3DpK7WxrsYGtkLIA/pub?gid=1917773469&single=true&output=csv";

      const loadData = async () => {
        setLoading(true);
        setError(null);
        try {
          const response = await fetch(CSV_URL);
          if (!response.ok) throw new Error("Falha na comunicação com o Google Sheets.");
          
          const csvText = await response.text();
          const parsed = parseCSVToObjects(csvText);
          
          setDataset(parsed);
          setLastUpdated(new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }));
        } catch (err) {
          console.error("Erro no fetch, usando fallback:", err);
          setError("Bloqueio de rede identificado (CORS). Carregando base de segurança.");
          const parsedFallback = parseCSVToObjects(FALLBACK_CSV);
          setDataset(parsedFallback);
          setLastUpdated("Offline (Fallback)");
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        loadData();
      }, []);

      useEffect(() => {
        localStorage.setItem('totvs-pendencias-views', JSON.stringify(savedViews));
      }, [savedViews]);

      const uniqueValues = useMemo(() => {
        const data = dataset.data;
        const sortValues = (values) => [...new Set(values)].filter(Boolean).sort((a, b) => a.localeCompare(b, 'pt-BR'));
        return {
          status: sortValues(data.map(item => item['Status'])),
          criticidade: sortValues(data.map(item => item['Criticidade'])),
          responsaveis: sortValues(data.map(item => item['Responsável'])),
          areas: sortValues(data.map(item => item['Área'])),
          etapas: sortValues(data.map(item => item['Etapa do Projeto'])),
          condicoes: sortValues(data.map(item => item['Condição Pendência'])),
        };
      }, [dataset]);

      const normalizeText = (value) => (value || '').toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
      const normalizeStatus = (status) => normalizeText(status);

      const getProgressNumber = (valueStr) => {
        const numValue = parseInt((valueStr || '').toString().replace('%', ''));
        return isNaN(numValue) ? 0 : numValue;
      };

      const criticidadeWeight = (criticidade) => {
        const c = normalizeText(criticidade);
        if (c.includes('critica')) return 4;
        if (c.includes('alta')) return 3;
        if (c.includes('media')) return 2;
        if (c.includes('baixa')) return 1;
        return 0;
      };

      const groupOptions = [
        { value: '', label: 'Sem agrupamento' },
        { value: 'Status', label: 'Status' },
        { value: 'Criticidade', label: 'Criticidade' },
        { value: 'Responsável', label: 'Responsável TOTVS' },
        { value: 'Área', label: 'Área' },
        { value: 'Etapa do Projeto', label: 'Etapa do Projeto' },
        { value: 'Condição Pendência', label: 'Condição da Pendência' },
      ];

      const sortOptions = [
        { value: 'criticidade', label: 'Prioridade inteligente' },
        { value: 'status', label: 'Status' },
        { value: 'responsavel', label: 'Responsável' },
        { value: 'progresso', label: '% Conclusão' },
        { value: 'id', label: 'ID' },
      ];

      const filteredData = useMemo(() => {
        const data = dataset.data.filter(row => {
          const matchesSearch = Object.values(row).some(val => normalizeText(val).includes(normalizeText(searchTerm)));
          const matchesStatus = statusFilter === '' || row['Status'] === statusFilter;
          const matchesCriticidade = criticidadeFilter === '' || row['Criticidade'] === criticidadeFilter;
          const matchesResponsavel = responsavelFilter === '' || row['Responsável'] === responsavelFilter;
          const matchesArea = areaFilter === '' || row['Área'] === areaFilter;
          const matchesEtapa = etapaFilter === '' || row['Etapa do Projeto'] === etapaFilter;
          const matchesCondicao = condicaoFilter === '' || row['Condição Pendência'] === condicaoFilter;

          return matchesSearch && matchesStatus && matchesCriticidade && matchesResponsavel && matchesArea && matchesEtapa && matchesCondicao;
        });

        return [...data].sort((a, b) => {
          if (sortBy === 'criticidade') return criticidadeWeight(b['Criticidade']) - criticidadeWeight(a['Criticidade']) || getProgressNumber(a['% Conclusão']) - getProgressNumber(b['% Conclusão']);
          if (sortBy === 'status') return (a['Status'] || '').localeCompare(b['Status'] || '', 'pt-BR');
          if (sortBy === 'responsavel') return (a['Responsável'] || '').localeCompare(b['Responsável'] || '', 'pt-BR');
          if (sortBy === 'progresso') return getProgressNumber(a['% Conclusão']) - getProgressNumber(b['% Conclusão']);
          if (sortBy === 'id') return Number(a['ID'] || 0) - Number(b['ID'] || 0);
          return 0;
        });
      }, [dataset, searchTerm, statusFilter, criticidadeFilter, responsavelFilter, areaFilter, etapaFilter, condicaoFilter, sortBy]);

      const kpis = useMemo(() => {
        const total = filteredData.length;
        const concluidas = filteredData.filter(d => normalizeStatus(d['Status']).includes('concluida')).length;
        const emExecucao = filteredData.filter(d => normalizeStatus(d['Status']).includes('em execucao')).length;
        const pendentes = filteredData.filter(d => normalizeStatus(d['Status']).includes('pendente')).length;
        const criticas = filteredData.filter(d => normalizeText(d['Criticidade']).includes('critica')).length;
        
        return { total, concluidas, emExecucao, pendentes, criticas };
      }, [filteredData]);

      const renderStatusBadge = (status) => {
        if (!status) return <span className="text-slate-400">-</span>;
        const s = normalizeText(status);
        if (s.includes('concluida')) {
          return <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800 border border-emerald-200"><IconCheckCircle2 size={12} /> {status}</span>;
        }
        if (s.includes('em execucao')) {
          return <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-blue-100 text-blue-800 border border-blue-200"><IconTrendingUp size={12} /> {status}</span>;
        }
        if (s.includes('pendente')) {
          return <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-amber-100 text-amber-800 border border-amber-200"><IconClock size={12} /> {status}</span>;
        }
        return <span className="px-2.5 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-800 border border-slate-200">{status}</span>;
      };

      const renderCriticidadeBadge = (criticidade) => {
        if (!criticidade) return <span className="text-slate-400">-</span>;
        const c = normalizeText(criticidade);
        if (c.includes('baixa')) return <span className="text-slate-500 font-medium">{criticidade}</span>;
        if (c.includes('media')) return <span className="text-amber-600 font-medium">{criticidade}</span>;
        if (c.includes('alta')) return <span className="text-orange-600 font-semibold">{criticidade}</span>;
        if (c.includes('critica')) return <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-bold bg-red-100 text-red-700 border border-red-200"><IconAlertTriangle size={12} /> {criticidade}</span>;
        return <span>{criticidade}</span>;
      };

      const renderProgressBar = (valueStr) => {
        if (!valueStr) return <span className="text-slate-400">-</span>;
        const numValue = parseInt(valueStr.replace('%', ''));
        if (isNaN(numValue)) return <span>{valueStr}</span>;
        
        let colorClass = 'bg-blue-500';
        if (numValue === 100) colorClass = 'bg-emerald-500';
        else if (numValue === 0) colorClass = 'bg-slate-300';
        else if (numValue > 0 && numValue < 50) colorClass = 'bg-amber-500';

        return (
          <div className="w-full max-w-[120px]">
            <div className="flex justify-between items-center mb-1 text-xs">
              <span className="font-medium text-slate-700">{valueStr}</span>
            </div>
            <div className="w-full bg-slate-100 rounded-full h-1.5 overflow-hidden">
              <div className={`${colorClass} h-1.5 rounded-full transition-all duration-500`} style={{ width: `${Math.min(100, Math.max(0, numValue))}%` }}></div>
            </div>
          </div>
        );
      };

      const setSmartFilter = (type) => {
        if (type === 'criticas') {
          const criticalValue = uniqueValues.criticidade.find(value => normalizeText(value).includes('critica')) || 'Crítica';
          setCriticidadeFilter(criticalValue);
          setStatusFilter('');
        }
        if (type === 'pendentes') {
          const pendingValue = uniqueValues.status.find(value => normalizeText(value).includes('pendente')) || 'Pendente';
          setStatusFilter(pendingValue);
          setCriticidadeFilter('');
        }
        if (type === 'emExecucao') {
          const executionValue = uniqueValues.status.find(value => normalizeText(value).includes('em execucao')) || 'Em execução';
          setStatusFilter(executionValue);
          setCriticidadeFilter('');
        }
        setSelectedViewId('');
      };

      const resetFilters = () => {
        setSearchTerm('');
        setStatusFilter('');
        setCriticidadeFilter('');
        setResponsavelFilter('');
        setAreaFilter('');
        setEtapaFilter('');
        setCondicaoFilter('');
        setGroupBy('');
        setSortBy('criticidade');
        setSelectedViewId('');
      };

      const currentViewConfig = () => ({
        viewMode, searchTerm, statusFilter, criticidadeFilter, responsavelFilter,
        areaFilter, etapaFilter, condicaoFilter, groupBy, sortBy,
      });

      const applyViewConfig = (config) => {
        setViewMode(config.viewMode || 'lista');
        setSearchTerm(config.searchTerm || '');
        setStatusFilter(config.statusFilter || '');
        setCriticidadeFilter(config.criticidadeFilter || '');
        setResponsavelFilter(config.responsavelFilter || '');
        setAreaFilter(config.areaFilter || '');
        setEtapaFilter(config.etapaFilter || '');
        setCondicaoFilter(config.condicaoFilter || '');
        setGroupBy(config.groupBy || '');
        setSortBy(config.sortBy || 'criticidade');
      };

      const saveCurrentView = () => {
        const defaultName = `${viewMode === 'kanban' ? 'Kanban' : 'Lista'} - ${groupBy ? `por ${groupBy}` : 'personalizada'}`;
        const name = window.prompt('Nome da visão:', defaultName);
        if (!name || !name.trim()) return;
        const newView = {
          id: `view-${Date.now()}`,
          name: name.trim(),
          createdAt: new Date().toISOString(),
          config: currentViewConfig(),
        };
        setSavedViews(prev => [...prev, newView]);
        setSelectedViewId(newView.id);
      };

      const handleSelectedViewChange = (id) => {
        setSelectedViewId(id);
        const selected = savedViews.find(view => view.id === id);
        if (selected) applyViewConfig(selected.config);
      };

      const removeSelectedView = () => {
        if (!selectedViewId) return;
        setSavedViews(prev => prev.filter(view => view.id !== selectedViewId));
        setSelectedViewId('');
      };

      const groupedData = useMemo(() => {
        const activeGroup = groupBy || (viewMode === 'kanban' ? 'Status' : '');
        if (!activeGroup) return [{ key: 'Todos', label: 'Todos os registros', rows: filteredData }];
        const groups = filteredData.reduce((acc, row) => {
          const key = row[activeGroup] || 'Sem preenchimento';
          if (!acc[key]) acc[key] = [];
          acc[key].push(row);
          return acc;
        }, {});
        return Object.entries(groups).map(([key, rows]) => ({ key, label: key, rows }));
      }, [filteredData, groupBy, viewMode]);

      const visibleColumns = ['ID', 'Área', 'Etapa do Projeto', 'Atividade', 'Responsável', 'Criticidade', '% Conclusão', 'Status'];
      const hasActiveFilters = searchTerm || statusFilter || criticidadeFilter || responsavelFilter || areaFilter || etapaFilter || condicaoFilter || groupBy || sortBy !== 'criticidade';

      const renderTaskCard = (row) => (
        <article key={row['ID'] || row['Atividade']} className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm hover:shadow-md hover:border-indigo-200 transition-all">
          <div className="flex items-start justify-between gap-3 mb-3">
            <div>
              <p className="text-xs font-semibold text-slate-400 uppercase tracking-wide">#{row['ID']} · {row['Área'] || 'Sem área'}</p>
              <h3 className="text-sm font-semibold text-slate-800 leading-snug mt-1">{row['Atividade'] || 'Atividade sem título'}</h3>
            </div>
            {renderCriticidadeBadge(row['Criticidade'])}
          </div>
          <p className="text-xs text-slate-500 line-clamp-3 mb-4">{row['Descrição'] || 'Sem descrição cadastrada.'}</p>
          <div className="grid grid-cols-2 gap-3 text-xs mb-4">
            <div className="bg-slate-50 rounded-lg p-2">
              <span className="block text-slate-400">Responsável</span>
              <strong className="text-slate-700">{row['Responsável'] || '-'}</strong>
            </div>
            <div className="bg-slate-50 rounded-lg p-2">
              <span className="block text-slate-400">Etapa</span>
              <strong className="text-slate-700">{row['Etapa do Projeto'] || '-'}</strong>
            </div>
          </div>
          <div className="flex items-center justify-between gap-3">
            {renderProgressBar(row['% Conclusão'])}
            {renderStatusBadge(row['Status'])}
          </div>
        </article>
      );

      const renderListTable = (rows) => (
        <div className="overflow-x-auto">
          <table className="w-full text-left border-collapse whitespace-nowrap min-w-max">
            <thead>
              <tr>
                {visibleColumns.map((header) => (
                  <th key={header} className="bg-slate-50 border-b border-slate-200 px-4 py-3 text-xs uppercase tracking-wider font-semibold text-slate-600 sticky top-0 z-10 text-left">
                    {header}
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {rows.map((row, rowIndex) => (
                <tr key={`${row['ID']}-${rowIndex}`} className="hover:bg-indigo-50/40 transition-colors group">
                  {visibleColumns.map((header) => {
                    const cellValue = row[header];
                    let content = cellValue || <span className="text-slate-400">-</span>;
                    if (header === 'Status') content = renderStatusBadge(cellValue);
                    else if (header === 'Criticidade') content = renderCriticidadeBadge(cellValue);
                    else if (header === '% Conclusão') content = renderProgressBar(cellValue);
                    let cellClass = "border-b border-slate-100 px-4 py-3 text-sm text-slate-700 max-w-[280px] truncate group-hover:text-slate-900 text-left align-top";
                    if (header === 'ID') cellClass += " font-semibold text-slate-500";
                    if (header === 'Atividade') cellClass += " whitespace-normal min-w-[320px] font-medium text-slate-800";
                    return <td key={header} className={cellClass} title={typeof cellValue === 'string' ? cellValue : ''}>{content}</td>;
                  })}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );

      return (
        <div className="min-h-screen bg-slate-50/50 flex flex-col">
          <header className="bg-white border-b border-slate-200 px-6 py-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 sticky top-0 z-30 shadow-sm">
            <div className="flex items-center gap-3">
              <div className="bg-indigo-600 p-2 rounded-lg shadow-sm">
                <IconLayoutDashboard size={20} className="text-white" />
              </div>
              <div>
                <h1 className="text-xl font-bold text-slate-800 leading-tight">Painel de Pendências</h1>
                <p className="text-xs text-slate-500">Gestão e acompanhamento do projeto</p>
              </div>
            </div>
            
            <div className="flex flex-col sm:flex-row items-start sm:items-center gap-4 text-sm w-full sm:w-auto">
              {error && (
                <div className="flex items-center gap-1.5 text-rose-600 bg-rose-50 border border-rose-100 px-3 py-1.5 rounded-md font-medium text-xs">
                  <IconAlertCircle size={14} /> <span className="hidden md:inline">{error}</span>
                </div>
              )}
              <div className="flex items-center gap-2 text-slate-500 text-xs font-medium ml-auto sm:ml-0">
                <span>Sincronizado:</span>
                <span className="bg-slate-100 px-2 py-1 rounded text-slate-700">{lastUpdated || 'Carregando...'}</span>
              </div>
              <button 
                onClick={loadData}
                disabled={loading}
                className="flex items-center gap-2 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 px-4 py-2 rounded-lg transition-all shadow-sm disabled:opacity-50 font-medium ml-auto sm:ml-0"
              >
                <IconRefreshCw size={16} className={loading ? "animate-spin text-indigo-600" : "text-slate-400"} />
                <span className="hidden sm:inline">Sincronizar Dados</span>
              </button>
              <a href="index.html?menu=1" className="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg transition-all shadow-sm font-medium">
                Voltar ao Menu Principal
              </a>
            </div>
          </header>

          <main className="flex-1 p-6 max-w-[1600px] w-full mx-auto flex flex-col gap-6">
            
            {/* KPI Cards */}
            <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
              <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex items-center gap-4 hover:border-indigo-200 hover:shadow-md transition-all">
                <div className="p-3 bg-indigo-50 text-indigo-600 rounded-lg"><IconListTodo size={24} /></div>
                <div>
                  <p className="text-sm text-slate-500 font-medium mb-0.5">Total</p>
                  <h3 className="text-2xl font-bold text-slate-800">{kpis.total}</h3>
                </div>
              </div>
              <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex items-center gap-4 hover:border-emerald-200 hover:shadow-md transition-all">
                <div className="p-3 bg-emerald-50 text-emerald-600 rounded-lg"><IconCheckCircle2 size={24} /></div>
                <div>
                  <p className="text-sm text-slate-500 font-medium mb-0.5">Concluídas</p>
                  <h3 className="text-2xl font-bold text-slate-800">{kpis.concluidas}</h3>
                </div>
              </div>
              <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex items-center gap-4 hover:border-blue-200 hover:shadow-md transition-all">
                <div className="p-3 bg-blue-50 text-blue-600 rounded-lg"><IconTrendingUp size={24} /></div>
                <div>
                  <p className="text-sm text-slate-500 font-medium mb-0.5">Em Execução</p>
                  <h3 className="text-2xl font-bold text-slate-800">{kpis.emExecucao}</h3>
                </div>
              </div>
              <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex items-center gap-4 hover:border-amber-200 hover:shadow-md transition-all">
                <div className="p-3 bg-amber-50 text-amber-600 rounded-lg"><IconClock size={24} /></div>
                <div>
                  <p className="text-sm text-slate-500 font-medium mb-0.5">Pendentes</p>
                  <h3 className="text-2xl font-bold text-slate-800">{kpis.pendentes}</h3>
                </div>
              </div>
              <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex items-center gap-4 hover:border-rose-200 hover:shadow-md transition-all">
                <div className="p-3 bg-rose-50 text-rose-600 rounded-lg"><IconAlertTriangle size={24} /></div>
                <div>
                  <p className="text-sm text-slate-500 font-medium mb-0.5">Críticas</p>
                  <h3 className="text-2xl font-bold text-slate-800">{kpis.criticas}</h3>
                </div>
              </div>
            </div>

            {/* Smart View Builder */}
            <section className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
              <div className="p-5 border-b border-slate-100 bg-gradient-to-r from-white to-slate-50 flex flex-col xl:flex-row xl:items-center justify-between gap-4">
                <div>
                  <p className="text-xs font-semibold text-indigo-600 uppercase tracking-[0.2em]">Visões inteligentes</p>
                  <h2 className="text-lg font-bold text-slate-800 mt-1">Organize, filtre, agrupe e salve seu modo de trabalho</h2>
                  <p className="text-sm text-slate-500 mt-1">A seleção da visão aplica automaticamente filtros, agrupamento, ordenação e formato Lista/Kanban.</p>
                </div>
                <div className="flex flex-wrap items-center gap-2">
                  <div className="bg-slate-100 p-1 rounded-xl flex items-center gap-1">
                    <button onClick={() => setViewMode('lista')} className={`px-4 py-2 rounded-lg text-sm font-semibold transition-all ${viewMode === 'lista' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>Lista</button>
                    <button onClick={() => setViewMode('kanban')} className={`px-4 py-2 rounded-lg text-sm font-semibold transition-all ${viewMode === 'kanban' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>Kanban</button>
                  </div>
                  <select value={selectedViewId} onChange={(e) => handleSelectedViewChange(e.target.value)} className="bg-white border border-slate-200 text-slate-700 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 px-3 py-2 outline-none min-w-[220px]">
                    <option value="">Selecionar visão salva</option>
                    {savedViews.map(view => <option key={view.id} value={view.id}>{view.name}</option>)}
                  </select>
                  <button onClick={saveCurrentView} className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-sm transition-all">Salvar visão</button>
                  {selectedViewId && <button onClick={removeSelectedView} className="bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 px-3 py-2 rounded-lg text-sm font-semibold transition-all">Excluir</button>}
                </div>
              </div>

              <div className="p-5 grid grid-cols-1 xl:grid-cols-[minmax(280px,1fr)_auto] gap-5 items-start">
                <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-3">
                  <div className="relative md:col-span-2 xl:col-span-2">
                    <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><IconSearch size={18} /></div>
                    <input type="text" placeholder="Buscar por atividade, descrição, responsável, etapa..." value={searchTerm} onChange={(e) => { setSearchTerm(e.target.value); setSelectedViewId(''); }} className="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-sm" />
                  </div>
                  <select value={statusFilter} onChange={(e) => { setStatusFilter(e.target.value); setSelectedViewId(''); }} className="bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-lg px-3 py-2.5 outline-none"><option value="">Todos os Status</option>{uniqueValues.status.map(val => <option key={val} value={val}>{val}</option>)}</select>
                  <select value={criticidadeFilter} onChange={(e) => { setCriticidadeFilter(e.target.value); setSelectedViewId(''); }} className="bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-lg px-3 py-2.5 outline-none"><option value="">Qualquer Criticidade</option>{uniqueValues.criticidade.map(val => <option key={val} value={val}>{val}</option>)}</select>
                  <select value={responsavelFilter} onChange={(e) => { setResponsavelFilter(e.target.value); setSelectedViewId(''); }} className="bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-lg px-3 py-2.5 outline-none"><option value="">Todos os Responsáveis</option>{uniqueValues.responsaveis.map(val => <option key={val} value={val}>{val}</option>)}</select>
                  <select value={areaFilter} onChange={(e) => { setAreaFilter(e.target.value); setSelectedViewId(''); }} className="bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-lg px-3 py-2.5 outline-none"><option value="">Todas as Áreas</option>{uniqueValues.areas.map(val => <option key={val} value={val}>{val}</option>)}</select>
                  <select value={etapaFilter} onChange={(e) => { setEtapaFilter(e.target.value); setSelectedViewId(''); }} className="bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-lg px-3 py-2.5 outline-none"><option value="">Todas as Etapas</option>{uniqueValues.etapas.map(val => <option key={val} value={val}>{val}</option>)}</select>
                  <select value={condicaoFilter} onChange={(e) => { setCondicaoFilter(e.target.value); setSelectedViewId(''); }} className="bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-lg px-3 py-2.5 outline-none"><option value="">Todas as Condições</option>{uniqueValues.condicoes.map(val => <option key={val} value={val}>{val}</option>)}</select>
                  <select value={groupBy} onChange={(e) => { setGroupBy(e.target.value); setSelectedViewId(''); }} className="bg-indigo-50 border border-indigo-100 text-indigo-800 text-sm rounded-lg px-3 py-2.5 outline-none"><option value="">Agrupar: inteligente padrão</option>{groupOptions.filter(opt => opt.value).map(opt => <option key={opt.value} value={opt.value}>Agrupar por {opt.label}</option>)}</select>
                  <select value={sortBy} onChange={(e) => { setSortBy(e.target.value); setSelectedViewId(''); }} className="bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-lg px-3 py-2.5 outline-none">{sortOptions.map(opt => <option key={opt.value} value={opt.value}>Ordenar: {opt.label}</option>)}</select>
                </div>

                <div className="bg-slate-50 rounded-xl border border-slate-200 p-3 min-w-[280px]">
                  <div className="flex items-center gap-2 text-sm text-slate-600 font-semibold mb-3"><IconFilter size={16} /> Atalhos inteligentes</div>
                  <div className="flex flex-wrap gap-2">
                    <button onClick={() => setSmartFilter('criticas')} className="px-3 py-1.5 rounded-full bg-rose-50 text-rose-700 border border-rose-200 text-xs font-semibold hover:bg-rose-100">Críticas</button>
                    <button onClick={() => setSmartFilter('pendentes')} className="px-3 py-1.5 rounded-full bg-amber-50 text-amber-700 border border-amber-200 text-xs font-semibold hover:bg-amber-100">Pendentes</button>
                    <button onClick={() => setSmartFilter('emExecucao')} className="px-3 py-1.5 rounded-full bg-blue-50 text-blue-700 border border-blue-200 text-xs font-semibold hover:bg-blue-100">Em execução</button>
                    {hasActiveFilters && <button onClick={resetFilters} className="px-3 py-1.5 rounded-full bg-white text-indigo-700 border border-indigo-200 text-xs font-semibold hover:bg-indigo-50">Limpar tudo</button>}
                  </div>
                  <div className="mt-4 grid grid-cols-3 gap-2 text-center">
                    <div className="bg-white rounded-lg border border-slate-100 p-2"><span className="block text-lg font-bold text-slate-800">{filteredData.length}</span><span className="text-[11px] text-slate-500">itens</span></div>
                    <div className="bg-white rounded-lg border border-slate-100 p-2"><span className="block text-lg font-bold text-rose-600">{kpis.criticas}</span><span className="text-[11px] text-slate-500">críticas</span></div>
                    <div className="bg-white rounded-lg border border-slate-100 p-2"><span className="block text-lg font-bold text-indigo-600">{groupedData.length}</span><span className="text-[11px] text-slate-500">grupos</span></div>
                  </div>
                </div>
              </div>
            </section>

            {/* Results */}
            <section className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex-1 flex flex-col">
              <div className="px-5 py-4 border-b border-slate-100 flex flex-col md:flex-row md:items-center justify-between gap-3 bg-white">
                <div>
                  <h2 className="text-base font-bold text-slate-800">{viewMode === 'kanban' ? 'Quadro Kanban' : 'Lista profissional'}</h2>
                  <p className="text-sm text-slate-500">Exibindo <span className="font-semibold text-slate-700">{filteredData.length}</span> registros{filteredData.length !== dataset.data.length && ` de ${dataset.data.length}`}.</p>
                </div>
                <div className="text-xs text-slate-500 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2">
                  Agrupamento ativo: <strong className="text-slate-700">{groupBy || (viewMode === 'kanban' ? 'Status' : 'Nenhum')}</strong>
                </div>
              </div>

              {loading && dataset.data.length === 0 ? (
                <div className="flex flex-col items-center justify-center h-64 text-slate-400 gap-3"><div className="animate-spin text-indigo-400"><IconRefreshCw size={32} /></div><p>Processando base de dados...</p></div>
              ) : filteredData.length === 0 ? (
                <div className="flex flex-col items-center justify-center h-64 text-slate-500 gap-2"><div className="text-slate-300 mb-2"><IconSearch size={32} /></div><p className="font-medium text-slate-700">Nenhum resultado encontrado.</p><p className="text-sm">Tente ajustar seus filtros de busca ou selecionar outra visão.</p></div>
              ) : viewMode === 'kanban' ? (
                <div className="p-5 overflow-x-auto flex-1 bg-slate-50/70">
                  <div className="flex gap-4 min-w-max pb-2">
                    {groupedData.map(group => (
                      <div key={group.key} className="w-[340px] flex-shrink-0">
                        <div className="sticky top-0 z-10 bg-slate-100/95 backdrop-blur border border-slate-200 rounded-xl px-4 py-3 mb-3 flex items-center justify-between">
                          <h3 className="font-bold text-slate-800 text-sm truncate">{group.label}</h3>
                          <span className="text-xs font-bold text-slate-500 bg-white border border-slate-200 rounded-full px-2 py-0.5">{group.rows.length}</span>
                        </div>
                        <div className="flex flex-col gap-3">{group.rows.map(renderTaskCard)}</div>
                      </div>
                    ))}
                  </div>
                </div>
              ) : groupBy ? (
                <div className="divide-y divide-slate-100">
                  {groupedData.map(group => (
                    <details key={group.key} open className="group/list">
                      <summary className="cursor-pointer select-none px-5 py-3 bg-slate-50 hover:bg-slate-100 flex items-center justify-between text-sm font-bold text-slate-700">
                        <span>{group.label}</span><span className="text-xs bg-white border border-slate-200 text-slate-500 rounded-full px-2 py-0.5">{group.rows.length} registros</span>
                      </summary>
                      {renderListTable(group.rows)}
                    </details>
                  ))}
                </div>
              ) : renderListTable(filteredData)}
            </section>

          </main>
        </div>
      );
    }

    // Renderizar o App na div root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
