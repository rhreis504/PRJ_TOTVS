    const IconPencil = ({ size = 24, className = "" }) => (

    );
    const IconTrash = ({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="m19 6-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
    );

    // ==========================================
    // FUNÇÕES UTILITÁRIAS
    // ==========================================
    const EXPECTED_HEADERS = ['ID','Área','Categoria','Etapa do Projeto','Sprint','Atividade','Descrição','Responsável','Criticidade','Responsável Cliente','Data Identificação','Data Planejada','Dias para Concluir','Condição Pendência','Data Conclusão','% Conclusão','Status'];

    function parseCSVToObjects(text) {
      const rows = [];
      let currentRow = [];
      let currentCell = '';
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (char === '"' && text[i + 1] === '"') {
          currentCell += '"';
          i++;
        } else if (char === '"') {
          insideQuotes = !insideQuotes;
        } else if (char === ',' && !insideQuotes) {
          currentRow.push(currentCell.trim());
          currentCell = '';
        } else if ((char === '\n' || char === '\r') && !insideQuotes) {
          if (char === '\r' && text[i + 1] === '\n') i++;
          currentRow.push(currentCell.trim());
          rows.push(currentRow);
          currentRow = [];
          currentCell = '';
        } else {
          currentCell += char;
        }
      }
      if (currentCell || text[text.length - 1] === ',') {
        currentRow.push(currentCell.trim());
      }
      if (currentRow.length > 0) {
        rows.push(currentRow);
      }

      const cleanedRows = rows.filter(row => row.some(cell => cell !== ''));
      if (cleanedRows.length === 0) return [];

      const stripLeadingEmptyColumn = (inputRows = []) => {
        if (inputRows.length === 0) return inputRows;

        const hasLeadingEmptyColumn = inputRows.every((row) => {
          if (!row || row.length === 0) return true;
          return (row[0] || '').trim() === '';
        });

        if (!hasLeadingEmptyColumn) return inputRows;
        return inputRows.map((row) => row.slice(1));
      };

      const normalizedRows = stripLeadingEmptyColumn(cleanedRows);

      const headers = EXPECTED_HEADERS;
      const normalize = (value = '') => value
        .toString()
        .normalize('NFD')
        .replace(/[̀-ͯ]/g, '')
        .toLowerCase()
        .trim();

      const headerMatches = (row = []) => {
        const normalizedExpected = headers.map(normalize);
        const normalizedRow = row.map(normalize);
        const matches = normalizedExpected.reduce((count, header, index) => {
          return count + (normalizedRow[index] === header ? 1 : 0);
        }, 0);
        return matches;
      };

      const sourceHeaderIndex = headerMatches(normalizedRows[1]) > headerMatches(normalizedRows[0]) ? 1 : 0;
      const sourceHeaders = normalizedRows[sourceHeaderIndex] || [];
      const sourceIndexByHeader = new Map(sourceHeaders.map((header, index) => [header, index]));
      const sprintIndex = headers.indexOf('Sprint');
      const hasSprintHeader = sourceIndexByHeader.has('Sprint');
      const data = [];

      const normalizedHeaders = headers.map(normalize);

      const isHeaderLikeRow = (cells) => {
        const normalizedCells = cells.map(normalize);

        const matchesAtOffset = (offset) => normalizedHeaders.every((header, index) => {
          const value = normalizedCells[index + offset] || '';
          return value === '' || value === header;
        });

        return matchesAtOffset(0) || matchesAtOffset(1) || matchesAtOffset(-1);
      };

      for (let i = sourceHeaderIndex + 1; i < normalizedRows.length; i++) {
        const row = normalizedRows[i];

        let alignedRow = row;

        if (!hasSprintHeader && row.length === headers.length - 1) {
          // Fonte sem coluna Sprint: insere célula vazia para manter o restante alinhado.
          alignedRow = [...row.slice(0, sprintIndex), '', ...row.slice(sprintIndex)];
        }

        if (isHeaderLikeRow(alignedRow)) continue;

        const rowValues = headers.map((header, index) => {
          const sourceIndex = sourceIndexByHeader.has(header) ? sourceIndexByHeader.get(header) : index;
          return (alignedRow[sourceIndex] || '').trim();
        });

        const hasRealContent = rowValues.some(cell => cell && cell !== '-');
        if (!hasRealContent || isHeaderLikeRow(rowValues)) continue;

        const obj = {};
        headers.forEach((header, index) => {
          obj[header] = rowValues[index] || '';
        });
        data.push(obj);
      }

      return { headers, data };
    }

    const FALLBACK_CSV = `ID,Área,Categoria,Etapa do Projeto,Sprint,Atividade,Descrição,Responsável,Criticidade,Responsável Cliente,Data Identificação,Data Planejada,Dias para Concluir,Condição Pendência,Data Conclusão,% Conclusão,Status
1,Governança,Planejamento,Iniciação,,Recebimento de documentos TOTVS,Receber materiais iniciais do projeto enviados pela TOTVS,Fabio Daumichen,Baixa,,28/04/2026,28/04/2026,,Dentro do Prazo,,100%,Concluída
2,Governança,Planejamento,Iniciação,,Consolidação de informações do projeto,Levantamento de escopo soluções contatos e propostas,Regis Reis,Baixa,,28/04/2026,29/04/2026,,Dentro do Prazo,,100%,Concluída
3,Governança,Planejamento,Iniciação,,Mapeamento de stakeholders,Identificação de contatos TOTVS e Rossi,Regis Reis,Baixa,,28/04/2026,29/04/2026,,Dentro do Prazo,,100%,Concluída
4,Técnico,Planejamento,Iniciação,,Identificação de dependências,Levantamento de dependências entre soluções,Regis Reis,Crítica,,28/04/2026,30/04/2026,,Dentro do Prazo,,50%,Em execução
5,Governança,Planejamento,Iniciação,,Definição da estratégia de comunicação,Criação da abordagem para alinhamento,Regis Reis,Média,,28/04/2026,08/05/2026,,Dentro do Prazo,,0%,Pendente`;

    // ==========================================
    // COMPONENTE PRINCIPAL
    // ==========================================
    function App() {
      const [dataset, setDataset] = useState({ headers: [], data: [] });
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [lastUpdated, setLastUpdated] = useState(null);

      const defaultFilters = {
        searchTerm: '', statusFilter: '', criticidadeFilter: '', responsavelFilter: '', responsavelClienteFilter: '',
        areaFilter: '', categoriaFilter: '', etapaFilter: '', sprintFilter: '', condicaoFilter: '', plannedFrom: '', plannedTo: '',
        onlyAtrasadas: false, onlyNaoConcluidas: false, onlySemResponsavel: false, onlySemResponsavelTotvs: false, onlySemResponsavelCliente: false, onlyVencendo7: false, onlyDependenciaCliente: false, onlyRiscoGoLive: false,
      };

      const [filters, setFilters] = useState(defaultFilters);
      const [viewMode, setViewMode] = useState('lista');
      const [groupByPrimary, setGroupByPrimary] = useState('');
      const [groupBySecondary, setGroupBySecondary] = useState('');
      const [sortBy, setSortBy] = useState('priority');
      const [selectedViewId, setSelectedViewId] = useState('');
      const [activeQuickViewId, setActiveQuickViewId] = useState('all');
      const [advancedFiltersOpen, setAdvancedFiltersOpen] = useState(false);
      const [saveModalOpen, setSaveModalOpen] = useState(false);
      const emptySaveForm = { name: '', description: '', setAsDefault: false, editingViewId: '', config: null };
      const [saveForm, setSaveForm] = useState(emptySaveForm);
      const [selectedTask, setSelectedTask] = useState(null);
      const [popup, setPopup] = useState(null);
      const [collapsedGroups, setCollapsedGroups] = useState({});
      const [savedViews, setSavedViews] = useState(() => {
        const storedViews = localStorage.getItem('totvs-pendencias-views');
        if (!storedViews) return [];
        try {
          const parsedViews = JSON.parse(storedViews);
          if (!Array.isArray(parsedViews)) return [];
          return parsedViews.map((view, index) => ({
            id: view.id || `legacy-${index}`,
            name: view.name || `Visão ${index + 1}`,
            description: view.description || '',
            createdAt: view.createdAt || new Date().toISOString(),
            isDefault: Boolean(view.isDefault),
            config: {
              viewMode: view.config?.viewMode || 'lista',
              filters: { ...defaultFilters, ...(view.config?.filters || {}),
                searchTerm: view.config?.searchTerm || view.config?.filters?.searchTerm || '',
                statusFilter: view.config?.statusFilter || view.config?.filters?.statusFilter || '',
                criticidadeFilter: view.config?.criticidadeFilter || view.config?.filters?.criticidadeFilter || '',
                responsavelFilter: view.config?.responsavelFilter || view.config?.filters?.responsavelFilter || '',
                areaFilter: view.config?.areaFilter || view.config?.filters?.areaFilter || '',
                etapaFilter: view.config?.etapaFilter || view.config?.filters?.etapaFilter || '',
                condicaoFilter: view.config?.condicaoFilter || view.config?.filters?.condicaoFilter || '',
              },
              groupByPrimary: view.config?.groupByPrimary || view.config?.groupBy || '',
              groupBySecondary: view.config?.groupBySecondary || '',
              sortBy: view.config?.sortBy === 'criticidade' ? 'priority' : (view.config?.sortBy || 'priority'),
            },
          }));
        } catch (err) {
          console.warn('Não foi possível carregar visões salvas:', err);
          return [];
        }
      });

      const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRtv0fQo2zhQbwtFFvJRkG-aK8EjzorUup951_Pt6x0UAbRwT3DpK7WxrsYGtkLIA/pub?gid=1917773469&single=true&output=csv";

      const loadData = async () => {
        setLoading(true);
        setError(null);
        try {
          const response = await fetch(CSV_URL);
          if (!response.ok) throw new Error("Falha na comunicação com o Google Sheets.");
          const csvText = await response.text();
          const parsed = parseCSVToObjects(csvText);
          setDataset(parsed);
          setLastUpdated(new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }));
        } catch (err) {
          console.error("Erro no fetch, usando fallback:", err);
          setError("Bloqueio de rede identificado (CORS). Carregando base de segurança.");
          setDataset(parseCSVToObjects(FALLBACK_CSV));
          setLastUpdated("Offline (Fallback)");
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => { loadData(); }, []);
      useEffect(() => { localStorage.setItem('totvs-pendencias-views', JSON.stringify(savedViews)); }, [savedViews]);
      useEffect(() => {
        const defaultView = savedViews.find(view => view.isDefault);
        if (defaultView) {
          setSelectedViewId(defaultView.id);
          setActiveQuickViewId('saved-' + defaultView.id);
          applyViewConfig(defaultView.config);
        }
      }, []);

      const normalizeText = (value) => (value || '').toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
      const updateFilter = (key, value) => { setFilters(prev => ({ ...prev, [key]: value })); setSelectedViewId(''); setActiveQuickViewId('custom'); };
      const getProgressNumber = (valueStr) => {
        const numValue = parseInt((valueStr || '').toString().replace('%', '').replace(',', '.'));
        return isNaN(numValue) ? 0 : numValue;
      };
      const getCriticidadeWeight = (criticidade) => {
        const c = normalizeText(criticidade);
        if (c.includes('critica')) return 100;
        if (c.includes('alta')) return 70;
        if (c.includes('media')) return 40;
        if (c.includes('baixa')) return 15;
        return 0;
      };
      const parseDate = (value) => {
        if (!value) return null;
        const clean = value.toString().trim();
        const br = clean.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
        if (br) return new Date(Number(br[3]), Number(br[2]) - 1, Number(br[1]));
        const iso = clean.match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (iso) return new Date(Number(iso[1]), Number(iso[2]) - 1, Number(iso[3]));
        const date = new Date(clean);
        return isNaN(date.getTime()) ? null : date;
      };
      const daysBetween = (from, to) => Math.ceil((to.setHours(0,0,0,0) - from.setHours(0,0,0,0)) / 86400000);

      const enrichedData = useMemo(() => {
        const today = new Date();
        return dataset.data.map((item) => {
          const progressNumber = getProgressNumber(item['% Conclusão']);
          const criticidadeWeight = getCriticidadeWeight(item['Criticidade']);
          const status = normalizeText(item['Status']);
          const condicao = normalizeText(item['Condição Pendência']);
          const plannedDate = parseDate(item['Data Planejada']);
          const venceEmDias = plannedDate ? daysBetween(new Date(today), new Date(plannedDate)) : null;
          const isConcluida = status.includes('concluida') || progressNumber >= 100;
          const isPendente = status.includes('pendente');
          const isEmExecucao = status.includes('em execucao');
          const isAtrasada = !isConcluida && venceEmDias !== null && venceEmDias < 0;
          const diasAtraso = isAtrasada ? Math.abs(venceEmDias) : 0;
          const isVencendoNosProximos7Dias = !isConcluida && venceEmDias !== null && venceEmDias >= 0 && venceEmDias <= 7;
          const semResponsavelTotvs = !item['Responsável'] || ['-', 'sem responsavel', 'nao definido', 'n/a'].includes(normalizeText(item['Responsável']));
          const semResponsavelCliente = !item['Responsável Cliente'] || ['-', 'sem responsavel', 'nao definido', 'n/a'].includes(normalizeText(item['Responsável Cliente']));
          const condicaoCritica = ['atrasado', 'bloqueado', 'impedido', 'dependencia', 'cliente'].some(term => condicao.includes(term));
          let priorityScore = criticidadeWeight;
          if (isPendente) priorityScore += 20;
          if (isEmExecucao) priorityScore += 12;
          if (isAtrasada) priorityScore += 45 + Math.min(diasAtraso, 30);
          if (isVencendoNosProximos7Dias) priorityScore += 25;
          if (progressNumber < 25) priorityScore += 18; else if (progressNumber < 50) priorityScore += 12; else if (progressNumber < 80) priorityScore += 6;
          if (semResponsavelTotvs) priorityScore += 18;
          if (semResponsavelCliente) priorityScore += 10;
          if (condicaoCritica) priorityScore += 20;
          if (isConcluida) priorityScore = Math.max(0, priorityScore - 80);
          return { ...item, progressNumber, criticidadeWeight, isConcluida, isPendente, isEmExecucao, isAtrasada, diasAtraso, venceEmDias, isVencendoNosProximos7Dias, semResponsavelTotvs, semResponsavelCliente, priorityScore: Math.max(0, Math.min(199, Math.round(priorityScore))) };
        });
      }, [dataset.data]);

      const uniqueValues = useMemo(() => {
        const sortValues = (values) => [...new Set(values)].filter(Boolean).sort((a, b) => a.localeCompare(b, 'pt-BR'));
        return {
          status: sortValues(dataset.data.map(item => item['Status'])), criticidade: sortValues(dataset.data.map(item => item['Criticidade'])),
          responsaveis: sortValues(dataset.data.map(item => item['Responsável'])), responsaveisCliente: sortValues(dataset.data.map(item => item['Responsável Cliente'])),
          areas: sortValues(dataset.data.map(item => item['Área'])), categorias: sortValues(dataset.data.map(item => item['Categoria'])),
          etapas: sortValues(dataset.data.map(item => item['Etapa do Projeto'])), sprints: sortValues(dataset.data.map(item => item['Sprint'])), condicoes: sortValues(dataset.data.map(item => item['Condição Pendência'])),
        };
      }, [dataset.data]);

      const groupOptions = [
        { value: '', label: 'Sem agrupamento' }, { value: 'Status', label: 'Status' }, { value: 'Criticidade', label: 'Criticidade' },
        { value: 'Responsável', label: 'Responsável TOTVS' }, { value: 'Responsável Cliente', label: 'Responsável Cliente' }, { value: 'Área', label: 'Área' },
        { value: 'Categoria', label: 'Categoria' }, { value: 'Etapa do Projeto', label: 'Etapa do Projeto' }, { value: 'Sprint', label: 'Sprint' }, { value: 'Condição Pendência', label: 'Condição Pendência' },
      ];
      const sortOptions = [
        { value: 'priority', label: 'Prioridade inteligente' }, { value: 'maisAtrasadas', label: 'Mais atrasadas' }, { value: 'vencimento', label: 'Vencimento mais próximo' },
        { value: 'menorProgresso', label: 'Menor progresso' }, { value: 'maiorProgresso', label: 'Maior progresso' }, { value: 'criticidade', label: 'Criticidade' },
        { value: 'status', label: 'Status' }, { value: 'responsavel', label: 'Responsável TOTVS' }, { value: 'responsavelCliente', label: 'Responsável Cliente' },
        { value: 'etapa', label: 'Etapa do Projeto' }, { value: 'id', label: 'ID' },
      ];

      const filteredData = useMemo(() => {
        const plannedFromDate = parseDate(filters.plannedFrom);
        const plannedToDate = parseDate(filters.plannedTo);
        const data = enrichedData.filter(row => {
          const rowDate = parseDate(row['Data Planejada']);
          const matchesSearch = !filters.searchTerm || Object.values(row).some(val => normalizeText(val).includes(normalizeText(filters.searchTerm)));
          const matchesDates = (!plannedFromDate || (rowDate && rowDate >= plannedFromDate)) && (!plannedToDate || (rowDate && rowDate <= plannedToDate));
          return matchesSearch
            && (!filters.statusFilter || row['Status'] === filters.statusFilter)

            <section className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex-1 flex flex-col">
              <div className="px-5 py-4 border-b border-slate-100 flex flex-col md:flex-row md:items-center justify-between gap-3 bg-white"><div><h2 className="text-base font-bold text-slate-800">{viewMode === 'kanban' ? 'Quadro Kanban' : 'Lista profissional completa'}</h2><p className="text-sm text-slate-500">Exibindo <span className="font-semibold text-slate-700">{filteredData.length}</span> registros{filteredData.length !== dataset.data.length && ` de ${dataset.data.length}`}.</p></div><div className="text-xs text-slate-500 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2">Agrupamento ativo: <strong className="text-slate-700">{groupByPrimary || (viewMode === 'kanban' ? 'Status' : 'Nenhum')}</strong>{groupBySecondary && <span> / {groupBySecondary}</span>}</div></div>
              {loading && dataset.data.length === 0 ? <div className="flex flex-col items-center justify-center h-64 text-slate-400 gap-3"><div className="animate-spin text-indigo-400"><IconRefreshCw size={32} /></div><p>Processando base de dados...</p></div> : filteredData.length === 0 ? <div className="flex flex-col items-center justify-center h-64 text-slate-500 gap-2"><div className="text-slate-300 mb-2"><IconSearch size={32} /></div><p className="font-medium text-slate-700">Nenhum resultado encontrado.</p><p className="text-sm">Tente ajustar seus filtros de busca ou selecionar outra visão.</p></div> : viewMode === 'kanban' ? <div className="p-5 overflow-x-auto flex-1 bg-slate-50/70"><div className="flex gap-4 min-w-max pb-2">{groupedData.map(group => {
                const collapsed = isGroupCollapsed('kanban', group.key);
                return <div key={group.key} className="w-[360px] flex-shrink-0"><div className={`sticky top-0 z-10 rounded-xl px-4 py-3 mb-3 shadow-sm transition-colors ${collapsed ? 'bg-indigo-50/95 border border-indigo-200' : 'bg-indigo-100/95 border border-indigo-200'}`}><div className="flex items-start justify-between gap-2 mb-2"><div className="min-w-0"><p className="text-[10px] font-black uppercase tracking-[0.2em] text-indigo-500 mb-1">Agrupador</p><h3 className="font-bold text-indigo-950 text-sm truncate">{group.label}</h3></div><span className="text-xs font-bold text-indigo-700 bg-white border border-indigo-200 rounded-full px-2 py-0.5">{group.stats.total}</span></div><div className="flex flex-col gap-3">{renderGroupBadges(group.stats)}<GroupToggleButton collapsed={collapsed} onClick={() => toggleGroupCollapse('kanban', group.key)} /></div></div>{!collapsed && <div className="flex flex-col gap-3">{group.rows.map(renderTaskCard)}</div>}</div>;
              })}</div></div> : groupByPrimary ? <div className="divide-y divide-indigo-100">{groupedData.map(group => {
                const collapsed = isGroupCollapsed('lista', group.key);
                return <section key={group.key} className="bg-white"><div className={`px-5 py-3 border-l-4 border-indigo-500 shadow-sm transition-colors ${collapsed ? 'bg-indigo-50/80' : 'bg-indigo-100/80'}`}><div className="flex flex-col md:flex-row md:items-center justify-between gap-3"><div className="min-w-0"><p className="text-[10px] font-black uppercase tracking-[0.2em] text-indigo-500 mb-1">Agrupador principal</p><h3 className="text-sm font-bold text-indigo-950 truncate">{group.label}</h3></div><div className="flex flex-wrap items-center gap-2">{renderGroupBadges(group.stats)}<GroupToggleButton collapsed={collapsed} onClick={() => toggleGroupCollapse('lista', group.key)} /></div></div></div>{!collapsed && (group.children.length ? group.children.map(child => {
                  const childCollapsed = isGroupCollapsed('lista', group.key, child.key);
                  return <section key={child.key} className="border-t border-indigo-100"><div className={`px-8 py-2.5 border-l-4 border-sky-400 transition-colors ${childCollapsed ? 'bg-sky-50/70' : 'bg-sky-100/70'}`}><div className="flex flex-col md:flex-row md:items-center justify-between gap-2"><div><p className="text-[10px] font-black uppercase tracking-[0.16em] text-sky-600 mb-1">Agrupador secundário</p><h4 className="text-sm font-semibold text-sky-950">{child.label}</h4></div><div className="flex flex-wrap items-center gap-2">{renderGroupBadges(child.stats)}<GroupToggleButton collapsed={childCollapsed} onClick={() => toggleGroupCollapse('lista', group.key, child.key)} /></div></div></div>{!childCollapsed && renderListTable(child.rows)}</section>;
                }) : renderListTable(group.rows))}</section>;
              })}</div> : renderListTable(filteredData)}
            </section>
              </div>
            </div>
          </main>

          {saveModalOpen && <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 p-4"><div className={`bg-white rounded-2xl shadow-xl border border-slate-200 w-full ${saveForm.editingViewId ? 'max-w-5xl' : 'max-w-lg'} max-h-[92vh] overflow-hidden flex flex-col`}><div className="px-5 py-4 border-b border-slate-100"><h3 className="text-lg font-bold text-slate-800">{saveForm.editingViewId ? 'Editar visão executiva' : 'Salvar visão executiva'}</h3><p className="text-sm text-slate-500">{saveForm.editingViewId ? 'Revise e altere todos os filtros, agrupamentos, ordenação e modo que foram salvos para esta visão.' : 'Guarde filtros, agrupamentos, ordenação e modo de visualização.'}</p></div><div className="p-5 flex flex-col gap-4 overflow-y-auto"><div className="grid grid-cols-1 md:grid-cols-2 gap-3"><label className="text-sm font-semibold text-slate-600">Nome<input value={saveForm.name} onChange={e => setSaveForm(prev => ({ ...prev, name: e.target.value }))} className="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2.5 outline-none focus:ring-2 focus:ring-indigo-100" /></label><label className="flex items-center gap-2 text-sm text-slate-700 md:pt-7"><input type="checkbox" checked={saveForm.setAsDefault} onChange={e => setSaveForm(prev => ({ ...prev, setAsDefault: e.target.checked }))} />Definir como visão padrão</label><label className="text-sm font-semibold text-slate-600 md:col-span-2">Descrição opcional<textarea value={saveForm.description} onChange={e => setSaveForm(prev => ({ ...prev, description: e.target.value }))} rows="2" className="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2.5 outline-none focus:ring-2 focus:ring-indigo-100" /></label></div>{saveForm.editingViewId && saveForm.config && <div className="rounded-2xl border border-indigo-100 bg-indigo-50/40 p-4 flex flex-col gap-4"><div className="flex flex-col md:flex-row md:items-center justify-between gap-3"><div><h4 className="text-sm font-bold text-slate-800">Filtros salvos nesta visão</h4><p className="text-xs text-slate-500">Altere os campos abaixo e clique em salvar para atualizar a visão. Resultado estimado: <strong className="text-indigo-700">{getViewCount(saveForm.config)}</strong> pendência(s).</p></div><div className="flex flex-wrap gap-2"><button type="button" onClick={resetSaveFormConfigFilters} className="px-3 py-2 rounded-lg text-xs font-bold border border-slate-200 bg-white text-slate-700 hover:bg-slate-50">Limpar filtros do modal</button><button type="button" onClick={applySaveFormConfigToScreen} className="px-3 py-2 rounded-lg text-xs font-bold border border-indigo-200 bg-white text-indigo-700 hover:bg-indigo-50">Aplicar prévia na tela</button></div></div><label className="flex flex-col gap-1 text-xs font-semibold text-slate-500"><span>Busca livre</span><input value={saveForm.config.filters.searchTerm} onChange={e => updateSaveFormConfigFilter('searchTerm', e.target.value)} placeholder="Buscar por descrição, responsável, categoria..." className="bg-white border border-slate-200 text-slate-700 text-sm rounded-lg px-3 py-2.5 outline-none focus:ring-2 focus:ring-indigo-100" /></label><div className="grid grid-cols-1 lg:grid-cols-4 gap-4"><div className="rounded-xl border border-slate-100 bg-white/80 p-3"><h5 className="text-xs font-bold uppercase tracking-wide text-slate-400 mb-3">Status</h5><div className="grid gap-3"><SelectField label="Status" value={saveForm.config.filters.statusFilter} onChange={v => updateSaveFormConfigFilter('statusFilter', v)} options={uniqueValues.status} /><SelectField label="Criticidade" value={saveForm.config.filters.criticidadeFilter} onChange={v => updateSaveFormConfigFilter('criticidadeFilter', v)} options={uniqueValues.criticidade} /><SelectField label="Condição da Pendência" value={saveForm.config.filters.condicaoFilter} onChange={v => updateSaveFormConfigFilter('condicaoFilter', v)} options={uniqueValues.condicoes} /><ToggleField label="Não concluídas" checked={saveForm.config.filters.onlyNaoConcluidas} onChange={v => updateSaveFormConfigFilter('onlyNaoConcluidas', v)} /></div></div><div className="rounded-xl border border-slate-100 bg-white/80 p-3"><h5 className="text-xs font-bold uppercase tracking-wide text-slate-400 mb-3">Equipe</h5><div className="grid gap-3"><SelectField label="Responsável TOTVS" value={saveForm.config.filters.responsavelFilter} onChange={v => updateSaveFormConfigFilter('responsavelFilter', v)} options={uniqueValues.responsaveis} /><SelectField label="Responsável Cliente" value={saveForm.config.filters.responsavelClienteFilter} onChange={v => updateSaveFormConfigFilter('responsavelClienteFilter', v)} options={uniqueValues.responsaveisCliente} /><ToggleField label="Sem responsável" checked={saveForm.config.filters.onlySemResponsavel} onChange={v => updateSaveFormConfigFilter('onlySemResponsavel', v)} /><ToggleField label="Sem responsável TOTVS" checked={saveForm.config.filters.onlySemResponsavelTotvs} onChange={v => updateSaveFormConfigFilter('onlySemResponsavelTotvs', v)} /><ToggleField label="Sem responsável cliente" checked={saveForm.config.filters.onlySemResponsavelCliente} onChange={v => updateSaveFormConfigFilter('onlySemResponsavelCliente', v)} /></div></div><div className="rounded-xl border border-slate-100 bg-white/80 p-3"><h5 className="text-xs font-bold uppercase tracking-wide text-slate-400 mb-3">Projeto</h5><div className="grid gap-3"><SelectField label="Área" value={saveForm.config.filters.areaFilter} onChange={v => updateSaveFormConfigFilter('areaFilter', v)} options={uniqueValues.areas} /><SelectField label="Categoria" value={saveForm.config.filters.categoriaFilter} onChange={v => updateSaveFormConfigFilter('categoriaFilter', v)} options={uniqueValues.categorias} /><SelectField label="Etapa do Projeto" value={saveForm.config.filters.etapaFilter} onChange={v => updateSaveFormConfigFilter('etapaFilter', v)} options={uniqueValues.etapas} /><SelectField label="Sprint" value={saveForm.config.filters.sprintFilter} onChange={v => updateSaveFormConfigFilter('sprintFilter', v)} options={uniqueValues.sprints} /></div></div><div className="rounded-xl border border-slate-100 bg-white/80 p-3"><h5 className="text-xs font-bold uppercase tracking-wide text-slate-400 mb-3">Período e flags</h5><div className="grid gap-3"><label className="flex flex-col gap-1 text-xs font-semibold text-slate-500"><span>Data Planejada de</span><input type="date" value={saveForm.config.filters.plannedFrom} onChange={e => updateSaveFormConfigFilter('plannedFrom', e.target.value)} className="bg-white border border-slate-200 text-slate-700 text-sm rounded-lg px-3 py-2.5 outline-none focus:ring-2 focus:ring-indigo-100" /></label><label className="flex flex-col gap-1 text-xs font-semibold text-slate-500"><span>Data Planejada até</span><input type="date" value={saveForm.config.filters.plannedTo} onChange={e => updateSaveFormConfigFilter('plannedTo', e.target.value)} className="bg-white border border-slate-200 text-slate-700 text-sm rounded-lg px-3 py-2.5 outline-none focus:ring-2 focus:ring-indigo-100" /></label><ToggleField label="Apenas atrasadas" checked={saveForm.config.filters.onlyAtrasadas} onChange={v => updateSaveFormConfigFilter('onlyAtrasadas', v)} /><ToggleField label="Vencendo em 7 dias" checked={saveForm.config.filters.onlyVencendo7} onChange={v => updateSaveFormConfigFilter('onlyVencendo7', v)} /><ToggleField label="Dependência do cliente" checked={saveForm.config.filters.onlyDependenciaCliente} onChange={v => updateSaveFormConfigFilter('onlyDependenciaCliente', v)} /><ToggleField label="Risco para Go Live" checked={saveForm.config.filters.onlyRiscoGoLive} onChange={v => updateSaveFormConfigFilter('onlyRiscoGoLive', v)} /></div></div></div><div className="grid grid-cols-1 md:grid-cols-4 gap-3"><label className="flex flex-col gap-1 text-xs font-semibold text-slate-500"><span>Modo</span><select value={saveForm.config.viewMode} onChange={e => updateSaveFormConfig({ viewMode: e.target.value })} className="bg-white border border-slate-200 text-slate-700 text-sm rounded-lg px-3 py-2.5 outline-none focus:ring-2 focus:ring-indigo-100"><option value="lista">Lista</option><option value="kanban">Kanban</option></select></label><label className="flex flex-col gap-1 text-xs font-semibold text-slate-500"><span>Agrupamento principal</span><select value={saveForm.config.groupByPrimary} onChange={e => updateSaveFormConfig({ groupByPrimary: e.target.value })} className="bg-white border border-slate-200 text-slate-700 text-sm rounded-lg px-3 py-2.5 outline-none focus:ring-2 focus:ring-indigo-100">{groupOptions.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}</select></label><label className="flex flex-col gap-1 text-xs font-semibold text-slate-500"><span>Agrupamento secundário</span><select value={saveForm.config.groupBySecondary} onChange={e => updateSaveFormConfig({ groupBySecondary: e.target.value })} className="bg-white border border-slate-200 text-slate-700 text-sm rounded-lg px-3 py-2.5 outline-none focus:ring-2 focus:ring-indigo-100">{groupOptions.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}</select></label><label className="flex flex-col gap-1 text-xs font-semibold text-slate-500"><span>Ordenação</span><select value={saveForm.config.sortBy} onChange={e => updateSaveFormConfig({ sortBy: e.target.value })} className="bg-white border border-slate-200 text-slate-700 text-sm rounded-lg px-3 py-2.5 outline-none focus:ring-2 focus:ring-indigo-100">{sortOptions.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}</select></label></div></div>}</div><div className="px-5 py-4 border-t border-slate-100 flex justify-end gap-2 bg-white"><button onClick={closeSaveModal} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-700 font-semibold">Cancelar</button><button onClick={saveCurrentView} disabled={!saveForm.name.trim()} className="px-4 py-2 rounded-lg bg-indigo-600 text-white font-semibold disabled:opacity-40 disabled:cursor-not-allowed">{saveForm.editingViewId ? 'Salvar alterações' : 'Salvar visão'}</button></div></div></div>}

          {selectedTask && <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/45 p-4"><div className="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-4xl max-h-[90vh] overflow-hidden flex flex-col"><div className="px-5 py-4 border-b border-slate-100 flex items-start justify-between gap-4"><div><p className="text-xs font-bold text-indigo-600 uppercase tracking-wide">Pendência #{selectedTask['ID']}</p><h3 className="text-lg font-bold text-slate-800">{selectedTask['Atividade'] || 'Atividade sem título'}</h3><div className="flex flex-wrap gap-2 mt-2">{renderStatusBadge(selectedTask['Status'])}{renderCriticidadeBadge(selectedTask['Criticidade'])}{renderScoreBadge(selectedTask)}{renderLateBadge(selectedTask)}</div></div><button onClick={() => setSelectedTask(null)} className="text-slate-400 hover:text-slate-700 text-2xl leading-none">×</button></div><div className="p-5 overflow-y-auto"><div className="grid grid-cols-1 md:grid-cols-2 gap-3">{(dataset.headers.length ? dataset.headers : EXPECTED_HEADERS).map(header => <div key={header} className={`rounded-xl border border-slate-200 bg-slate-50 p-3 ${header === 'Descrição' || header === 'Atividade' ? 'md:col-span-2' : ''}`}><span className="block text-xs font-bold text-slate-400 uppercase tracking-wide mb-1">{header}</span><div className="text-sm text-slate-800 whitespace-pre-wrap">{header === 'Status' ? renderStatusBadge(selectedTask[header]) : header === 'Criticidade' ? renderCriticidadeBadge(selectedTask[header]) : header === '% Conclusão' ? renderProgressBar(selectedTask[header]) : (selectedTask[header] || <span className="text-slate-400">-</span>)}</div></div>)}<div className="rounded-xl border border-indigo-100 bg-indigo-50 p-3"><span className="block text-xs font-bold text-indigo-400 uppercase tracking-wide mb-1">Score de prioridade</span><div>{renderScoreBadge(selectedTask)}</div></div><div className="rounded-xl border border-red-100 bg-red-50 p-3"><span className="block text-xs font-bold text-red-400 uppercase tracking-wide mb-1">Atraso calculado</span><div className="text-sm text-red-700 font-semibold">{selectedTask.isAtrasada ? `${selectedTask.diasAtraso} dia(s)` : 'Sem atraso'}</div></div></div></div></div></div>}
        </div>
      );
    }

    // Renderizar o App na div root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
