<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inteligência PMO</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .chat-scroll::-webkit-scrollbar-track { background: #f8fafc; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // ==========================================
    // ÍCONES SVG
    // ==========================================
    const Icons = {
      Brain: (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/><path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/><path d="M17.599 6.5a3 3 0 0 0 .399-1.375"/><path d="M6.002 5.125A3 3 0 0 0 6.401 6.5"/><path d="M3.477 10.896a4 4 0 0 1 .585-.396"/><path d="M19.938 10.5a4 4 0 0 1 .585.396"/><path d="M6 18a4 4 0 0 1-1.967-.516"/><path d="M19.967 17.484A4 4 0 0 1 18 18"/></svg>,
      Send: (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><line x1="22" x2="11" y1="2" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>,
      Sparkles: (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M7 5H3"/></svg>,
      Settings: (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
      AlertTriangle: (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>,
      CheckCircle: (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
      Activity: (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>,
      FileText: (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>,
      X: (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    };

    // ==========================================
    // VARIÁVEIS / DADOS BRUTOS DO PROJETO
    // ==========================================
    // Estes são os arrays que a IA vai ler para entender a saúde.
    const projectData = {
      pendencias: [
        { id: 1, desc: "Aprovação de Layout", status: "Concluída", criticidade: "Baixa", diasAtraso: 0, temResponsavel: true },
        { id: 2, desc: "Configuração de Servidor", status: "Aberta", criticidade: "Alta", diasAtraso: 12, temResponsavel: false },
        { id: 3, desc: "Integração Legado", status: "Em Andamento", criticidade: "Crítica", diasAtraso: 5, temResponsavel: true },
        { id: 4, desc: "Treinamento Usuários", status: "Aberta", criticidade: "Média", diasAtraso: 0, temResponsavel: true }
      ],
      riscos: [
        { id: 1, desc: "Falta de licenças TOTVS", status: "Aberto", impacto: "Crítico", planoConcluido: false, impactaGoLive: true },
        { id: 2, desc: "Atraso na entrega de hardware", status: "Monitorado", impacto: "Alto", planoConcluido: true, impactaGoLive: false },
        { id: 3, desc: "Rotatividade da equipe cliente", status: "Materializado", impacto: "Médio", planoConcluido: false, impactaGoLive: false }
      ],
      gaps: [
        { id: 1, desc: "Customização de Relatório Fiscal", status: "Sem decisão", impactoPrazo: true, impactoCusto: true },
        { id: 2, desc: "Novo módulo de RH", status: "Aprovado", impactoPrazo: false, impactoCusto: false },
        { id: 3, desc: "Integração Bancária Específica", status: "Sem decisão", impactoPrazo: true, impactoCusto: false }
      ]
    };

    // ==========================================
    // MOTOR DE CÁLCULO DA SAÚDE
    // ==========================================
    function calculatePendingScore(pendencias) {
      let score = 100;
      let penalty = 0;
      let overdue = 0;
      
      pendencias.forEach(p => {
        if (p.status === "Concluída" || p.status === "Cancelada") return;
        
        if (p.criticidade === "Crítica") penalty += 15;
        else if (p.criticidade === "Alta") penalty += 10;
        else if (p.criticidade === "Média") penalty += 5;

        if (p.diasAtraso > 0) {
          penalty += 10;
          overdue++;
        }
        if (!p.temResponsavel) penalty += 5;
      });

      score = Math.max(0, 100 - penalty);
      return { score, penalty, overdue, total: pendencias.length };
    }

    function calculateRiskScore(riscos) {
      let score = 100;
      let penalty = 0;
      let criticalWithoutPlan = 0;

      riscos.forEach(r => {
        if (r.status === "Encerrado") return;

        if (r.impacto === "Crítico") penalty += 25;
        else if (r.impacto === "Alto") penalty += 15;
        else if (r.impacto === "Médio") penalty += 5;

        if (!r.planoConcluido) penalty += 10;
        if (r.impactaGoLive) penalty += 20;

        if (r.impacto === "Crítico" && !r.planoConcluido) criticalWithoutPlan++;
      });

      score = Math.max(0, 100 - penalty);
      return { score, penalty, criticalWithoutPlan, total: riscos.length };
    }

    function calculateGapScore(gaps) {
      let score = 100;
      let penalty = 0;
      let undecided = 0;

      gaps.forEach(g => {
        if (g.status === "Concluído" || g.status === "Aprovado" || g.status === "Recusado") return;

        if (g.status === "Sem decisão") {
          penalty += 15;
          undecided++;
        }
        if (g.impactoPrazo) penalty += 20;
        if (g.impactoCusto) penalty += 15;
      });

      score = Math.max(0, 100 - penalty);
      return { score, penalty, undecided, total: gaps.length };
    }

    // ==========================================
    // COMPONENTE PRINCIPAL (REACT)
    // ==========================================
    function App() {
      // Estado de Configurações
      const DEFAULT_CONFIG = { weights: { pending: 0.35, risks: 0.40, gaps: 0.25 } };
      const [config, setConfig] = useState(DEFAULT_CONFIG);
      const [isConfigOpen, setIsConfigOpen] = useState(false);
      
      // Estado do Chat
      const [chatHistory, setChatHistory] = useState([
        { role: 'ai', text: "Olá! Sou a Inteligência PMO. Estou conectada aos dados de Pendências, Riscos e GAPs do projeto. Como posso ajudar a analisar a saúde hoje?" }
      ]);
      const [inputValue, setInputValue] = useState('');
      const [isTyping, setIsTyping] = useState(false);
      const chatEndRef = useRef(null);

      // Carregar config do localStorage
      useEffect(() => {
        const saved = localStorage.getItem('pmo_health_config');
        if (saved) {
          try { setConfig(JSON.parse(saved)); } catch(e){}
        }
      }, []);

      // Auto-scroll do chat
      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [chatHistory, isTyping]);

      // ------------------------------------------
      // EXECUÇÃO DO MOTOR DE CÁLCULO
      // ------------------------------------------
      const healthResult = useMemo(() => {
        const pResult = calculatePendingScore(projectData.pendencias);
        const rResult = calculateRiskScore(projectData.riscos);
        const gResult = calculateGapScore(projectData.gaps);

        const overall = Math.round(
          (pResult.score * config.weights.pending) +
          (rResult.score * config.weights.risks) +
          (gResult.score * config.weights.gaps)
        );

        return {
          overallScore: overall,
          pending: pResult,
          risk: rResult,
          gap: gResult
        };
      }, [config]);

      // Regras de Cor e Status
      const getHealthClass = (score) => {
        if (score >= 90) return { label: 'Saudável', color: 'text-emerald-600 bg-emerald-50 border-emerald-200' };
        if (score >= 75) return { label: 'Atenção Leve', color: 'text-blue-600 bg-blue-50 border-blue-200' };
        if (score >= 60) return { label: 'Atenção Moderada', color: 'text-amber-600 bg-amber-50 border-amber-200' };
        if (score >= 40) return { label: 'Crítico', color: 'text-rose-600 bg-rose-50 border-rose-200' };
        return { label: 'Muito Crítico', color: 'text-red-800 bg-red-100 border-red-300' };
      };

      const healthStatus = getHealthClass(healthResult.overallScore);

      // ------------------------------------------
      // LÓGICA DA INTELIGÊNCIA ARTIFICIAL
      // ------------------------------------------
      const handleSendMessage = (textOverride) => {
        const text = textOverride || inputValue;
        if (!text.trim()) return;

        // Adiciona a mensagem do usuário
        const newHistory = [...chatHistory, { role: 'user', text }];
        setChatHistory(newHistory);
        setInputValue('');
        setIsTyping(true);

        // Processa a resposta baseada nos DADOS REAIS processados pelo Motor
        setTimeout(() => {
          let aiResponse = "";
          const lowerText = text.toLowerCase();

          if (lowerText.includes("saúde do projeto") || lowerText.includes("como está")) {
            aiResponse = `**Diagnóstico da Saúde do Projeto:**\nO projeto apresenta um Score Geral de **${healthResult.overallScore}%**, sendo classificado como **${healthStatus.label}**.\n\n` + 
                         `**Composição do Score:**\n` +
                         `- **Pendências:** Score de ${healthResult.pending.score}% (Peso: ${(config.weights.pending * 100).toFixed(0)}%)\n` +
                         `- **Riscos:** Score de ${healthResult.risk.score}% (Peso: ${(config.weights.risks * 100).toFixed(0)}%)\n` +
                         `- **GAPs/Mudanças:** Score de ${healthResult.gap.score}% (Peso: ${(config.weights.gaps * 100).toFixed(0)}%)\n\n` +
                         `Quer que eu explique por que ele está desse jeito?`;
          } 
          else if (lowerText.includes("por que") || lowerText.includes("motivo") || lowerText.includes("derrubando") || lowerText.includes("o que é a saúde")) {
            aiResponse = `**Análise de Causa (Por que o projeto está assim?):**\nA saúde não mede apenas quantidade, mede exposição. Veja os fatores que estão puxando sua nota para baixo:\n\n` +
                         `**1. Na dimensão de Riscos (Maior ofensor):**\nTemos ${healthResult.risk.criticalWithoutPlan} risco(s) avaliado(s) como *Crítico* e sem plano de ação concluído. Além disso, existe um risco que impacta diretamente o Go Live ("Falta de licenças TOTVS"). Como Riscos pesam ${(config.weights.risks * 100).toFixed(0)}%, isso afeta muito a saúde.\n\n` +
                         `**2. Na dimensão de GAPs:**\nO projeto possui ${healthResult.gap.undecided} GAP(s) ainda "Sem decisão" que possuem impacto direto no Prazo (ex: "Customização de Relatório Fiscal"). Isso gera penalidade grave.\n\n` +
                         `**3. Na dimensão de Pendências:**\nApesar de termos ${healthResult.pending.total} pendências, ${healthResult.pending.overdue} delas estão atrasadas e 1 delas (Configuração de Servidor) não possui responsável definido.\n\n` +
                         `**Recomendação Imediata:** Atuar no risco que impacta o Go Live e cobrar a aprovação dos GAPs com impacto de prazo.`;
          }
          else if (lowerText.includes("simule") || lowerText.includes("simulação")) {
            // IA fazendo uma simulação recalculando sem a penalidade dos GAPs
            const simulatedGapScore = 100; // Simula que aprovou todos os Gaps
            const simulatedOverall = Math.round(
              (healthResult.pending.score * config.weights.pending) +
              (healthResult.risk.score * config.weights.risks) +
              (simulatedGapScore * config.weights.gaps)
            );
            aiResponse = `**Simulação: E se aprovarmos todos os GAPs sem decisão?**\n\n- Score Atual: **${healthResult.overallScore}%**\n- Score Simulado: **${simulatedOverall}%**\n\n**Conclusão:** O projeto sairia de *${healthStatus.label}* para *${getHealthClass(simulatedOverall).label}*. Isso ajuda, mas não resolve o problema dos riscos críticos sem mitigação.`;
          }
          else {
            aiResponse = `Recebi sua solicitação. Com base na minha varredura das ${healthResult.pending.total} Pendências, ${healthResult.risk.total} Riscos e ${healthResult.gap.total} GAPs, estou pronta para gerar relatórios executivos ou priorizar itens. Você deseja saber "Quais itens atacar primeiro?" ou ver a "Saúde do projeto"?`;
          }

          setChatHistory([...newHistory, { role: 'ai', text: aiResponse }]);
          setIsTyping(false);
        }, 1200);
      };

      // Formatador de Negrito
      const formatMessage = (text) => {
        const parts = text.split('\n').map((line, i) => {
          const boldFormatted = line.split(/(\*\*.*?\*\*)/g).map((part, j) => {
            if (part.startsWith('**') && part.endsWith('**')) return <strong key={j} className="text-slate-900">{part.slice(2, -2)}</strong>;
            return part;
          });
          return <p key={i} className="mb-2 last:mb-0 leading-relaxed">{boldFormatted}</p>;
        });
        return parts;
      };

      const saveConfig = () => {
        const p = parseFloat(document.getElementById('w-pending').value) / 100;
        const r = parseFloat(document.getElementById('w-risks').value) / 100;
        const g = parseFloat(document.getElementById('w-gaps').value) / 100;
        if (p+r+g !== 1) {
          alert("A soma dos pesos deve ser exatamente 100%.");
          return;
        }
        
        const newConfig = { weights: { pending: p, risks: r, gaps: g } };
        setConfig(newConfig);
        localStorage.setItem('pmo_health_config', JSON.stringify(newConfig));
        setIsConfigOpen(false);
        
        setChatHistory(prev => [...prev, { 
          role: 'ai', 
          text: `Configurações ajustadas pelo PM!\nNovos pesos:\n- Pendências: ${(p*100)}%\n- Riscos: ${(r*100)}%\n- GAPs: ${(g*100)}%\n\nJá recalculei a saúde do projeto utilizando os novos pesos.` 
        }]);
      };

      return (
        <>
          <div className="flex flex-col h-screen overflow-hidden bg-slate-50 relative">
            
            {/* Top Header */}
            <header className="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shrink-0 z-10">
              <div className="flex items-center gap-3">
                <div className="bg-purple-100 p-2 rounded-lg text-purple-600">
                  <Icons.Brain size={24} />
                </div>
                <div>
                  <h1 className="text-xl font-bold text-slate-800">Inteligência PMO</h1>
                  <p className="text-xs text-slate-500">Análise estruturada de Pendências, Riscos e GAPs</p>
                </div>
              </div>
              <div className="flex items-center gap-4 text-sm text-right hidden md:block">
                <div className="text-slate-800 font-semibold">Projeto ERP Alpha</div>
                <div className="text-xs text-slate-500">Motor de Cálculo: Ativo</div>
              </div>
            </header>

            {/* Content Area */}
            <div className="flex-1 overflow-y-auto p-6 flex flex-col gap-6">
              
              {/* Executive Cards - Dados injetados pelo Motor de Cálculo */}
              <div className="grid grid-cols-1 md:grid-cols-4 gap-4 shrink-0">
                <div className={`p-5 rounded-xl border flex flex-col gap-2 ${healthStatus.color}`}>
                  <div className="flex items-center justify-between">
                    <span className="text-sm font-semibold uppercase tracking-wide opacity-80">Saúde Geral</span>
                    <Icons.Activity size={18} />
                  </div>
                  <div className="flex items-baseline gap-2 mt-1">
                    <span className="text-4xl font-bold">{healthResult.overallScore}</span>
                    <span className="text-sm font-medium opacity-80">/ 100</span>
                  </div>
                  <div className="text-sm font-medium opacity-90">{healthStatus.label}</div>
                </div>

                <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col gap-2 relative overflow-hidden">
                  <div className="absolute top-0 right-0 bg-slate-100 px-2 py-1 text-[10px] font-bold text-slate-400 rounded-bl-lg">PESO: {(config.weights.pending * 100).toFixed(0)}%</div>
                  <div className="flex items-center justify-between text-slate-600">
                    <span className="text-sm font-medium">Pendências</span>
                    <Icons.CheckCircle size={18} />
                  </div>
                  <div className="flex items-baseline gap-2 mt-1 text-slate-800">
                    <span className="text-3xl font-bold">{healthResult.pending.score}</span>
                  </div>
                  <div className="text-xs text-slate-500">
                    Atrasadas: <span className="font-semibold text-rose-600">{healthResult.pending.overdue}</span> de {healthResult.pending.total}
                  </div>
                </div>

                <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col gap-2 relative overflow-hidden">
                  <div className="absolute top-0 right-0 bg-slate-100 px-2 py-1 text-[10px] font-bold text-slate-400 rounded-bl-lg">PESO: {(config.weights.risks * 100).toFixed(0)}%</div>
                  <div className="flex items-center justify-between text-slate-600">
                    <span className="text-sm font-medium">Riscos</span>
                    <Icons.AlertTriangle size={18} className="text-amber-500" />
                  </div>
                  <div className="flex items-baseline gap-2 mt-1 text-slate-800">
                    <span className="text-3xl font-bold">{healthResult.risk.score}</span>
                  </div>
                  <div className="text-xs text-slate-500">
                    Críticos s/ plano: <span className="font-semibold text-rose-600">{healthResult.risk.criticalWithoutPlan}</span>
                  </div>
                </div>

                <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col gap-2 relative overflow-hidden">
                  <div className="absolute top-0 right-0 bg-slate-100 px-2 py-1 text-[10px] font-bold text-slate-400 rounded-bl-lg">PESO: {(config.weights.gaps * 100).toFixed(0)}%</div>
                  <div className="flex items-center justify-between text-slate-600">
                    <span className="text-sm font-medium">GAPs / Mudanças</span>
                    <Icons.FileText size={18} />
                  </div>
                  <div className="flex items-baseline gap-2 mt-1 text-slate-800">
                    <span className="text-3xl font-bold">{healthResult.gap.score}</span>
                  </div>
                  <div className="text-xs text-slate-500">
                    Sem decisão: <span className="font-semibold text-amber-600">{healthResult.gap.undecided}</span>
                  </div>
                </div>
              </div>

              {/* Workspace Principal (Chat + Lateral) */}
              <div className="flex-1 flex flex-col lg:flex-row gap-6 min-h-0">
                
                {/* Chat Area */}
                <div className="flex-1 bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col overflow-hidden">
                  <div className="px-5 py-3 border-b border-slate-100 flex items-center gap-2 bg-slate-50/50 text-slate-600">
                    <Icons.Sparkles size={16} className="text-purple-500" />
                    <h2 className="font-medium text-sm">IA conectada às Variáveis do Projeto</h2>
                  </div>
                  
                  {/* Messages */}
                  <div className="flex-1 overflow-y-auto p-5 chat-scroll flex flex-col gap-6">
                    {chatHistory.map((msg, idx) => (
                      <div key={idx} className={`flex gap-4 ${msg.role === 'user' ? 'flex-row-reverse' : ''}`}>
                        <div className={`w-8 h-8 rounded-full flex items-center justify-center shrink-0 ${msg.role === 'ai' ? 'bg-purple-100 text-purple-600' : 'bg-slate-800 text-white'}`}>
                          {msg.role === 'ai' ? <Icons.Brain size={16} /> : <span className="text-xs font-bold">PM</span>}
                        </div>
                        <div className={`max-w-[80%] rounded-2xl px-5 py-3.5 text-sm ${msg.role === 'user' ? 'bg-slate-800 text-white rounded-tr-none' : 'bg-slate-100 text-slate-700 rounded-tl-none'}`}>
                          {formatMessage(msg.text)}
                        </div>
                      </div>
                    ))}
                    {isTyping && (
                      <div className="flex gap-4">
                        <div className="w-8 h-8 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center shrink-0">
                          <Icons.Brain size={16} />
                        </div>
                        <div className="bg-slate-100 rounded-2xl rounded-tl-none px-5 py-3.5 flex items-center gap-1.5">
                          <div className="w-2 h-2 bg-purple-400 rounded-full animate-bounce"></div>
                          <div className="w-2 h-2 bg-purple-400 rounded-full animate-bounce" style={{animationDelay: '0.2s'}}></div>
                          <div className="w-2 h-2 bg-purple-400 rounded-full animate-bounce" style={{animationDelay: '0.4s'}}></div>
                        </div>
                      </div>
                    )}
                    <div ref={chatEndRef} />
                  </div>

                  {/* Input Area */}
                  <div className="p-4 border-t border-slate-100 bg-white">
                    <div className="relative">
                      <input 
                        type="text" 
                        value={inputValue}
                        onChange={(e) => setInputValue(e.target.value)}
                        onKeyDown={(e) => e.key === 'Enter' && handleSendMessage()}
                        placeholder="Ex: O que é a saúde do projeto? Por que ele está desse jeito?"
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl pl-4 pr-12 py-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500/20 focus:border-purple-500 transition-all"
                      />
                      <button 
                        onClick={() => handleSendMessage()}
                        disabled={!inputValue.trim() || isTyping}
                        className="absolute right-2 top-1/2 -translate-y-1/2 p-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 disabled:opacity-50 transition-colors"
                      >
                        <Icons.Send size={16} />
                      </button>
                    </div>
                  </div>
                </div>

                {/* Painel Lateral */}
                <div className="w-full lg:w-80 flex flex-col gap-4 overflow-y-auto pr-1">
                  
                  {/* Sugestões */}
                  <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                    <h3 className="text-sm font-semibold text-slate-800 mb-3 flex items-center gap-2">
                      <Icons.Sparkles size={16} className="text-amber-500" /> Consultar Variáveis
                    </h3>
                    <div className="flex flex-col gap-2">
                      <button onClick={() => handleSendMessage("O que é a saúde do projeto?")} className="text-left px-3 py-2 rounded-lg bg-slate-50 hover:bg-purple-50 hover:text-purple-700 text-xs text-slate-600 transition-colors border border-transparent hover:border-purple-100">
                        O que é a saúde do projeto?
                      </button>
                      <button onClick={() => handleSendMessage("Por que ele está desse jeito?")} className="text-left px-3 py-2 rounded-lg bg-slate-50 hover:bg-purple-50 hover:text-purple-700 text-xs text-slate-600 transition-colors border border-transparent hover:border-purple-100">
                        Por que ele está desse jeito? (Detalhar)
                      </button>
                      <button onClick={() => handleSendMessage("Simule a aprovação dos GAPs")} className="text-left px-3 py-2 rounded-lg bg-slate-50 hover:bg-purple-50 hover:text-purple-700 text-xs text-slate-600 transition-colors border border-transparent hover:border-purple-100">
                        Simular cenário positivo
                      </button>
                    </div>
                  </div>

                  {/* Settings Trigger */}
                  <button onClick={() => setIsConfigOpen(true)} className="flex items-center justify-center gap-2 w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-colors shadow-sm">
                    <Icons.Settings size={18} />
                    Configurar Pesos
                  </button>

                </div>
              </div>
            </div>
          </div>

          {/* Modal de Configuração */}
          {isConfigOpen && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden flex flex-col">
                <div className="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
                  <h2 className="text-lg font-bold text-slate-800">Ajuste de Variáveis (Pesos)</h2>
                  <button onClick={() => setIsConfigOpen(false)} className="p-1 hover:bg-slate-100 rounded-full text-slate-400">
                    <Icons.X size={20} />
                  </button>
                </div>
                
                <div className="p-6 flex flex-col gap-5">
                  <div className="space-y-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Peso: Pendências (%)</label>
                      <input type="number" defaultValue={config.weights.pending * 100} id="w-pending" className="w-full bg-slate-50 border border-slate-200 px-3 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-500/20 focus:border-purple-500" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Peso: Riscos (%)</label>
                      <input type="number" defaultValue={config.weights.risks * 100} id="w-risks" className="w-full bg-slate-50 border border-slate-200 px-3 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-500/20 focus:border-purple-500" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Peso: GAPs / Mudanças (%)</label>
                      <input type="number" defaultValue={config.weights.gaps * 100} id="w-gaps" className="w-full bg-slate-50 border border-slate-200 px-3 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-500/20 focus:border-purple-500" />
                    </div>
                  </div>
                </div>

                <div className="px-6 py-4 border-t border-slate-100 bg-slate-50 flex justify-end gap-3">
                  <button onClick={() => setIsConfigOpen(false)} className="px-4 py-2 text-sm font-medium text-slate-600 hover:text-slate-800">Cancelar</button>
                  <button onClick={saveConfig} className="px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 shadow-sm">
                    Salvar e Recalcular
                  </button>
                </div>
              </div>
            </div>
          )}
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
